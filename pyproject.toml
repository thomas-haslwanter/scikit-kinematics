[project]
name = "scikit-kinematics"
version = "0.11.0"
description = "Python utilites for movements in 3d space"
authors = [{ name = "Thomas Haslwanter", email = "thomas.haslwanter@fh-ooe.at" }]
requires-python = ">=3.9"
readme = "README.md"
license = "BSD-3-Clause"
keywords = [
    "quaterions",
    "rotations",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "docutils>= 0.3",
    "matplotlib> 3.9.1",
    "numpy>= 1.13.0",
    "pandas>= 1.0",
    "sympy>= 1.0",
    "scipy>= 1.5",
    "pygame>= 2.0",
    "deprecated>=1.2.8"
]

[project.urls]
Homepage = "https://work.thaslwanter.at/skinematics/html"
Repository = "https://github.com/thomas-haslwanter/scikit-kinematics"

[dependency-groups]
dev = [
    "pytest~=5.2",
    "black>=23.3.0,<24",
    "sphinx>=7.3.7,<8",
]

[tool.hatch.build.targets.sdist]
include = [
    "skinematics",
    "tests",
]

[tool.hatch.build.targets.wheel]
include = [
    "skinematics",
    "tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
